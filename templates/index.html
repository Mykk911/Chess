<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>2D Шахматы vs AI</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <main class="container">
      <section class="panel">
        <h1>2D Шахматы vs AI</h1>
        <div class="controls">
          <label>
            Уровень ИИ:
            <select id="level">
              <option value="100">100</option>
              <option value="500">500</option>
              <option value="1000" selected>1000</option>
              <option value="1500">1500</option>
              <option value="2000">2000</option>
            </select>
          </label>
          <label>
            Цвет:
            <select id="color">
              <option value="white" selected>Белые</option>
              <option value="black">Чёрные</option>
            </select>
          </label>
          <button id="new-game">Новая игра</button>
        </div>
        <p id="status">Загрузка...</p>
        <p id="hint">Кликни по фигуре, потом по клетке назначения.</p>
      </section>

      <section>
        <div id="board" class="board"></div>
      </section>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
